name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Run tests (unit + cucumber)
        run: mvn -B -U test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn

      - name: Prepare OWASP cache dir
        if: always()
        run: mkdir -p ~/.dependency-check

      - name: Cache OWASP data
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: ${{ runner.os }}-depcheck-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-depcheck-

      - name: OWASP Dependency Check (with fallback)
        if: always()
        run: |
          # 1) Спроба з оновленням (якщо ключ є і мережа ок)
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailOnError=false \
            -DnvdValidForHours=720 \
            -DnvdApiDelay=16000 \
            -DnvdMaxRetryCount=20 \
          || \
          # 2) Фолбек без оновлення (щоб звіт все одно генерився)
          mvn -B org.owasp:dependency-check-maven:check \
            -DautoUpdate=false \
            -DfailOnError=false

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.*
            target/dependency-check-report/**/*
          if-no-files-found: warn
