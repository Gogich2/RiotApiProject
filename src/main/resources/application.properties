spring.config.import=optional:file:.env[.properties]

riot.api.key=${RIOT_API_KEY:}

# Spring datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=raw
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging level without recompilation
logging.level.root=${APP_LOG_LEVEL:INFO}
logging.level.org.main=${APP_PACKAGE_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.boot.context.properties=${SPRING_PROPERTIES_LOG_LEVEL:INFO}

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Localization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale-resolver=accept-header

# Custom app settings
app.logging.http.enabled=${APP_HTTP_LOGGING_ENABLED:true}
app.logging.mask-riot-api-key=${APP_MASK_RIOT_API_KEY:true}

# Schedulers
app.scheduler.data-integrity.enabled=${APP_SCHEDULER_DATA_INTEGRITY_ENABLED:true}

# Riot API rate limiting
riot.rate-limit.enabled=${RIOT_RATE_LIMIT_ENABLED:true}
riot.rate-limit.per-second=${RIOT_RATE_LIMIT_PER_SECOND:5}
riot.rate-limit.per-two-minutes=${RIOT_RATE_LIMIT_PER_TWO_MINUTES:85}
riot.rate-limit.max-retries=${RIOT_RATE_LIMIT_MAX_RETRIES:5}

spring.devtools.restart.enabled=false