<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Riot Stats</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header class="site-header">
    <a class="site-header__logo" href="/">Riot Stats</a>

    <div class="search">
        <input class="search__input" id="globalSearchInput" type="text" placeholder="Search player or champion...">
        <div class="search__results" id="globalSearchResults"></div>
    </div>
</header>

<main class="page">
    <section class="hero">
        <h1 class="hero__title">League of Legends statistics</h1>
        <p class="hero__text">Global match statistics, champion analytics, player profiles and item performance.</p>
    </section>

    <section class="stats-grid" id="overviewStats"></section>

    <section class="section">
        <h2 class="section__title">Most popular champions</h2>
        <div class="table-wrapper">
            <table class="table">
                <thead>
                <tr>
                    <th>Champion</th>
                    <th>Games</th>
                    <th>Wins</th>
                    <th>Winrate</th>
                </tr>
                </thead>
                <tbody id="popularChampionsBody"></tbody>
            </table>
        </div>
    </section>

    <section class="section">
        <h2 class="section__title">Best winrate champions</h2>
        <div class="table-wrapper">
            <table class="table">
                <thead>
                <tr>
                    <th>Champion</th>
                    <th>Games</th>
                    <th>Wins</th>
                    <th>Winrate</th>
                </tr>
                </thead>
                <tbody id="bestChampionsBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/search.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
