<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="site-header">
    <a class="site-header__logo" href="index.html">Riot Stats</a>

    <div class="search">
        <input class="search__input" id="globalSearchInput" type="text" placeholder="Search player or champion...">
        <div class="search__results" id="globalSearchResults"></div>
    </div>
</header>

<main class="page">
    <section class="hero" id="playerHero"></section>

    <section class="stats-grid" id="playerStats"></section>

    <div class="player-tabs" id="playerTabs">
        <button class="player-tabs__button player-tabs__button--active" type="button" data-player-tab-button="overview">
            Overview
        </button>
        <button class="player-tabs__button" type="button" data-player-tab-button="champions">
            Champion Stats
        </button>
        <button class="player-tabs__button" type="button" data-player-tab-button="recommendations">
            Recommendations
        </button>
    </div>

    <section class="section" data-player-tab-panel="champions">
        <h2 class="section__title">Champion statistics</h2>
        <div class="player-champions" id="playerChampions"></div>
    </section>

    <div class="player-overview" data-player-tab-panel="overview">
        <div class="player-overview__side">
            <section class="section">
                <div class="section-header">
                    <h2 class="section__title">Ranked performance</h2>
                    <button class="button button--secondary" id="refreshRanksButton" type="button">
                        Refresh rank
                    </button>
                </div>

                <div class="rank-grid" id="playerRanks"></div>
            </section>

            <section class="section">
                <h2 class="section__title">Rank history</h2>
                <div class="rank-history-chart" id="playerRankChart"></div>
                <div class="rank-history" id="playerRankHistory"></div>
            </section>

            <section class="section">
                <h2 class="section__title">Recommendations summary</h2>
                <div class="insights" id="playerInsightsSummary"></div>
            </section>
        </div>

        <section class="section player-overview__matches">
            <h2 class="section__title">Recent matches</h2>
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Champion</th>
                        <th>Result</th>
                        <th>KDA</th>
                        <th>Queue</th>
                        <th>Version</th>
                        <th>Duration</th>
                    </tr>
                    </thead>
                    <tbody id="playerMatchesBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <section class="section player-recommendations" data-player-tab-panel="recommendations">
        <h2 class="section__title">Detailed recommendations</h2>
        <div class="insights" id="playerInsights"></div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/search.js"></script>
<script src="js/player.js"></script>
</body>
</html>
