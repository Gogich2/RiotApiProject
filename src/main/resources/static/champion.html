<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riot Stats | Champion</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="site-header">
    <a class="site-header__logo" href="index.html">Riot Stats</a>
    <nav class="site-nav" aria-label="Primary">
        <a class="site-nav__link" href="index.html">Home</a>
        <a class="site-nav__link" href="champions.html" aria-current="page">Champions</a>
        <a class="site-nav__link" href="players.html">Players</a>
    </nav>

    <div class="account-entry" data-account-entry>
        <a class="account-entry__link" href="account.html">Sign in</a>
    </div>

    <div class="search">
        <input class="search__input" id="globalSearchInput" type="text" placeholder="Search player or champion...">
        <div class="search__results" id="globalSearchResults"></div>
    </div>
</header>

<main class="page page--detail">
    <section class="champion-hero champion-hero--detail" id="championHero"></section>

    <section class="stats-grid stats-grid--detail" id="championStats"></section>

    <section class="section">
        <h2 class="section__title">Abilities</h2>
        <div class="abilities" id="championAbilities"></div>
    </section>

    <section class="section">
        <h2 class="section__title">Item statistics</h2>
        <div class="table-wrapper">
            <table class="table">
                <thead>
                <tr>
                    <th>Item</th>
                    <th>Games</th>
                    <th>Wins</th>
                    <th>Winrate</th>
                    <th>Pickrate</th>
                </tr>
                </thead>
                <tbody id="championItemsBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/account.js"></script>
<script src="js/search.js"></script>
<script src="js/champion.js"></script>
</body>
</html>
